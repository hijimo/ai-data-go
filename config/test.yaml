# 测试环境配置文件
# 用于单元测试和集成测试

server:
  port: '8081'
  host: 'localhost'
  mode: debug

genkit:
  provider: google
  api_key: 'test-api-key'
  model: 'gemini-2.5-flash'
  default_temperature: 0.7
  default_max_tokens: 1000
  log_level: debug
  timeout: '10s'

database:
  url: ''
  host: 'localhost'
  port: 5432
  database: 'genkit_test'
  user: 'postgres'
  password: 'postgres'
  ssl_mode: disable
  max_connections: 5
  max_idle_conns: 2
  conn_max_lifetime: '5m'
  log_level: silent

redis:
  host: 'localhost'
  port: 6379
  password: ''
  database: 1 # 使用不同的数据库避免冲突
  enabled: true

log:
  level: debug
  format: json
  enable_file: false
  log_dir: 'logs/test'
  enable_console: true

session:
  timeout: '10m'
  cleanup_interval: '1m'
  summary_threshold: 10
  default_page_size: 10
  max_page_size: 50
  max_title_length: 100

models:
  dir: './models'

auth:
  jwt_secret: 'test-secret-key-for-testing-only-min-32-chars'
  jwt_issuer: 'genkit-test'
  jwt_audience: 'genkit-test-api'
  access_token_ttl: '5m'
  refresh_token_ttl: '1h'
  bcrypt_cost: 4 # 使用最低cost加快测试速度
  max_login_attempts: 3
  login_attempt_window: '5m'
  password_min_length: 6
  enable_refresh_rotation: false
  tenant_identify_strategy: header
  token_cleanup_interval: '5m'
  enable_token_blacklist: true

bootstrap:
  admin_email: 'test-admin@test.local'
  admin_password: 'Test1234'
  admin_display_name: 'Test Admin'
  tenant_name: 'Test Tenant'
  tenant_domain: 'test.local'

monitoring:
  prometheus_port: 9091
  jaeger_endpoint: ''
  enable_tracing: false
  enable_metrics: false
  metrics_path: '/metrics'
  tracing_sampling: 0.0

cache:
  namespace: 'genkit:test'
  default_ttl: '1m'
  enable_warmup: false
  warmup_interval: '5m'
  context_ttl: '1m'
  vector_search_ttl: '5m'
  summary_ttl: '10m'
  session_list_ttl: '1m'
  token_usage_ttl: '1m'
  custom_ttl:
    user_profile: '1m'
    tenant_config: '5m'

vector:
  provider: google
  embedding_model: 'text-embedding-004'
  dimension: 768
  batch_size: 5
  timeout: '10s'
