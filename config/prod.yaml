# 生产环境配置文件
# 支持环境变量替换: ${VAR_NAME} 或 ${VAR_NAME:default_value}

server:
  port: '${SERVER_PORT:8080}'
  host: '${SERVER_HOST:0.0.0.0}'
  mode: release

genkit:
  provider: google
  api_key: '${GENKIT_API_KEY}'
  model: '${GENKIT_MODEL:gemini-2.5-flash}'
  default_temperature: 0.7
  default_max_tokens: 2000
  log_level: info
  timeout: '60s'

database:
  # 生产环境必须使用 DATABASE_URL
  url: '${DATABASE_URL}'
  host: '${DB_HOST}'
  port: 5432
  database: '${DB_NAME}'
  user: '${DB_USER}'
  password: '${DB_PASSWORD}'
  ssl_mode: require
  max_connections: 50
  max_idle_conns: 10
  conn_max_lifetime: '10m'
  log_level: error

redis:
  host: '${REDIS_HOST}'
  port: 6379
  password: '${REDIS_PASSWORD}'
  database: 0
  enabled: true

log:
  level: info
  format: json
  enable_file: true
  log_dir: /var/log/genkit
  enable_console: false

session:
  timeout: '30m'
  cleanup_interval: '5m'
  summary_threshold: 50
  default_page_size: 20
  max_page_size: 100
  max_title_length: 255

models:
  dir: '/app/models'

auth:
  jwt_secret: '${JWT_SECRET}'
  jwt_issuer: 'genkit-ai-service'
  jwt_audience: 'genkit-api'
  access_token_ttl: '60m'
  refresh_token_ttl: '720h' # 30 days
  bcrypt_cost: 12
  max_login_attempts: 5
  login_attempt_window: '15m'
  password_min_length: 12
  enable_refresh_rotation: true
  tenant_identify_strategy: header
  token_cleanup_interval: '1h'
  enable_token_blacklist: true

bootstrap:
  admin_email: '${PLATFORM_ADMIN_EMAIL}'
  admin_password: '${PLATFORM_ADMIN_PASSWORD}'
  admin_display_name: '${PLATFORM_ADMIN_NAME:Platform Admin}'
  tenant_name: '${PLATFORM_TENANT_NAME:Platform}'
  tenant_domain: '${PLATFORM_TENANT_DOMAIN}'

monitoring:
  prometheus_port: 9090
  jaeger_endpoint: '${JAEGER_ENDPOINT}'
  enable_tracing: true
  enable_metrics: true
  metrics_path: '/metrics'
  tracing_sampling: 0.1 # 生产环境采样10%的请求

cache:
  namespace: 'genkit:prod'
  default_ttl: '5m'
  enable_warmup: true
  warmup_interval: '30m'
  # 各类缓存的TTL配置
  context_ttl: '5m'
  vector_search_ttl: '30m'
  summary_ttl: '1h'
  session_list_ttl: '10m'
  token_usage_ttl: '5m'
  # 自定义缓存TTL
  custom_ttl:
    user_profile: '15m'
    tenant_config: '30m'

vector:
  provider: google # google, openai
  embedding_model: 'text-embedding-004'
  dimension: 768
  batch_size: 20
  timeout: '60s'
