# 开发环境配置文件
# 支持环境变量替换: ${VAR_NAME} 或 ${VAR_NAME:default_value}

server:
  port: '${SERVER_PORT:8080}'
  host: '${SERVER_HOST:0.0.0.0}'
  mode: debug

genkit:
  provider: google
  api_key: '${GENKIT_API_KEY}'
  model: '${GENKIT_MODEL:gemini-2.5-flash}'
  default_temperature: 0.7
  default_max_tokens: 2000
  log_level: debug
  timeout: '30s'

database:
  # 优先使用 DATABASE_URL，如果未设置则使用下面的独立配置
  url: '${DATABASE_URL}'
  host: '${DB_HOST:localhost}'
  port: 5432
  database: '${DB_NAME:genkit_ai_service}'
  user: '${DB_USER:postgres}'
  password: '${DB_PASSWORD:postgres}'
  ssl_mode: disable
  max_connections: 10
  max_idle_conns: 5
  conn_max_lifetime: '5m'
  log_level: info

redis:
  host: '${REDIS_HOST:localhost}'
  port: 6379
  password: '${REDIS_PASSWORD}'
  database: 0
  enabled: true

log:
  level: debug
  format: json
  enable_file: true
  log_dir: logs
  enable_console: true

session:
  timeout: '30m'
  cleanup_interval: '5m'
  summary_threshold: 50
  default_page_size: 20
  max_page_size: 100
  max_title_length: 255

models:
  dir: './models'

auth:
  jwt_secret: '${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}'
  jwt_issuer: 'genkit-ai-service'
  jwt_audience: 'genkit-api'
  access_token_ttl: '60m'
  refresh_token_ttl: '720h' # 30 days
  bcrypt_cost: 10
  max_login_attempts: 5
  login_attempt_window: '15m'
  password_min_length: 8
  enable_refresh_rotation: true
  tenant_identify_strategy: header
  token_cleanup_interval: '1h'
  enable_token_blacklist: true

bootstrap:
  admin_email: '${PLATFORM_ADMIN_EMAIL:admin@system.local}'
  admin_password: '${PLATFORM_ADMIN_PASSWORD}' # 留空则自动生成
  admin_display_name: '${PLATFORM_ADMIN_NAME:Platform Admin}'
  tenant_name: '${PLATFORM_TENANT_NAME:Platform}'
  tenant_domain: '${PLATFORM_TENANT_DOMAIN:system.local}'

monitoring:
  prometheus_port: 9090
  jaeger_endpoint: '${JAEGER_ENDPOINT:http://localhost:14268/api/traces}'
  enable_tracing: true
  enable_metrics: true
  metrics_path: '/metrics'
  tracing_sampling: 1.0 # 开发环境采样所有请求

cache:
  namespace: 'genkit:dev'
  default_ttl: '5m'
  enable_warmup: true
  warmup_interval: '10m'
  # 各类缓存的TTL配置
  context_ttl: '5m'
  vector_search_ttl: '30m'
  summary_ttl: '1h'
  session_list_ttl: '10m'
  token_usage_ttl: '5m'
  # 自定义缓存TTL
  custom_ttl:
    user_profile: '15m'
    tenant_config: '30m'

vector:
  provider: google # google, openai
  embedding_model: 'text-embedding-004'
  dimension: 768
  batch_size: 10
  timeout: '30s'
