<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流式对话接口演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .chat-container {
      padding: 24px;
      max-height: 500px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message.user {
      background: #e3f2fd;
      margin-left: auto;
      text-align: right;
    }

    .message.ai {
      background: #f5f5f5;
      margin-right: auto;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
    }

    .message .label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    .message .content {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message .meta {
      font-size: 11px;
      margin-top: 8px;
      opacity: 0.6;
    }

    .input-container {
      padding: 24px;
      border-top: 1px solid #e0e0e0;
      background: #fafafa;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: #667eea;
    }

    .input-group button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .input-group button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .input-group button:active {
      transform: translateY(0);
    }

    .input-group button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .option-group label {
      font-size: 12px;
      font-weight: 600;
      color: #666;
    }

    .option-group input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }

    .loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #667eea;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status {
      font-size: 12px;
      color: #666;
      text-align: center;
      padding: 8px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #667eea;
      animation: blink 1s infinite;
      margin-left: 2px;
    }

    @keyframes blink {

      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🤖 流式对话接口演示</h1>
      <p>实时体验 AI 流式生成效果</p>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="message ai">
        <div class="label">AI 助手</div>
        <div class="content">你好！我是 AI 助手。请输入你的问题，我会以流式方式回复你。</div>
      </div>
    </div>

    <div class="input-container">
      <div class="options">
        <div class="option-group">
          <label>API 地址</label>
          <input type="text" id="apiUrl" value="http://localhost:8080/api/v1/chat/stream">
        </div>
        <div class="option-group">
          <label>Temperature (0-2)</label>
          <input type="number" id="temperature" min="0" max="2" step="0.1" value="0.7">
        </div>
        <div class="option-group">
          <label>Max Tokens</label>
          <input type="number" id="maxTokens" min="1" value="2048">
        </div>
      </div>

      <div class="input-group">
        <input type="text" id="messageInput" placeholder="输入你的消息..." />
        <button id="sendButton" onclick="sendMessage()">发送</button>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    let isStreaming = false;
    let currentMessageDiv = null;

    // 发送消息
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();

      if (!message || isStreaming) return;

      // 显示用户消息
      addMessage('user', message);
      input.value = '';

      // 禁用发送按钮
      isStreaming = true;
      updateSendButton();

      // 创建 AI 消息容器
      currentMessageDiv = addMessage('ai', '', true);

      try {
        await streamChat(message);
      } catch (error) {
        addMessage('error', `错误: ${error.message}`);
      } finally {
        isStreaming = false;
        updateSendButton();
        removeCursor();
      }
    }

    // 流式对话
    async function streamChat(message) {
      const apiUrl = document.getElementById('apiUrl').value;
      const temperature = parseFloat(document.getElementById('temperature').value);
      const maxTokens = parseInt(document.getElementById('maxTokens').value);

      const requestBody = {
        message: message,
        options: {
          temperature: temperature,
          maxTokens: maxTokens
        }
      };

      updateStatus('正在连接...');

      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }

      updateStatus('正在接收响应...');

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();

        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // 保留不完整的行

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const data = JSON.parse(line.substring(6));
              handleStreamChunk(data);
            } catch (e) {
              console.error('解析数据失败:', e, line);
            }
          }
        }
      }

      updateStatus('');
    }

    // 处理流式数据块
    function handleStreamChunk(chunk) {
      if (chunk.error) {
        addMessage('error', `错误: ${chunk.error.message || JSON.stringify(chunk.error)}`);
        return;
      }

      if (chunk.content && currentMessageDiv) {
        const contentDiv = currentMessageDiv.querySelector('.content');
        const cursorSpan = contentDiv.querySelector('.cursor');

        if (cursorSpan) {
          contentDiv.removeChild(cursorSpan);
        }

        contentDiv.textContent += chunk.content;

        // 重新添加光标
        const newCursor = document.createElement('span');
        newCursor.className = 'cursor';
        contentDiv.appendChild(newCursor);

        // 滚动到底部
        scrollToBottom();
      }

      if (chunk.done && currentMessageDiv) {
        // 移除光标
        removeCursor();

        // 添加元数据
        if (chunk.model || chunk.usage) {
          const metaDiv = document.createElement('div');
          metaDiv.className = 'meta';

          let metaText = '';
          if (chunk.model) {
            metaText += `模型: ${chunk.model}`;
          }
          if (chunk.usage) {
            metaText += ` | Tokens: ${chunk.usage.totalTokens} (输入: ${chunk.usage.promptTokens}, 输出: ${chunk.usage.completionTokens})`;
          }

          metaDiv.textContent = metaText;
          currentMessageDiv.appendChild(metaDiv);
        }

        currentMessageDiv = null;
        updateStatus('完成');
        setTimeout(() => updateStatus(''), 2000);
      }
    }

    // 添加消息
    function addMessage(type, content, withCursor = false) {
      const chatContainer = document.getElementById('chatContainer');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;

      const labelDiv = document.createElement('div');
      labelDiv.className = 'label';
      labelDiv.textContent = type === 'user' ? '你' : type === 'error' ? '错误' : 'AI 助手';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'content';
      contentDiv.textContent = content;

      if (withCursor) {
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        contentDiv.appendChild(cursor);
      }

      messageDiv.appendChild(labelDiv);
      messageDiv.appendChild(contentDiv);
      chatContainer.appendChild(messageDiv);

      scrollToBottom();
      return messageDiv;
    }

    // 移除光标
    function removeCursor() {
      if (currentMessageDiv) {
        const cursor = currentMessageDiv.querySelector('.cursor');
        if (cursor) {
          cursor.remove();
        }
      }
    }

    // 更新发送按钮状态
    function updateSendButton() {
      const button = document.getElementById('sendButton');
      button.disabled = isStreaming;
      button.textContent = isStreaming ? '发送中...' : '发送';
    }

    // 更新状态
    function updateStatus(text) {
      document.getElementById('status').textContent = text;
    }

    // 滚动到底部
    function scrollToBottom() {
      const chatContainer = document.getElementById('chatContainer');
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 回车发送
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !isStreaming) {
        sendMessage();
      }
    });
  </script>
</body>

</html>
